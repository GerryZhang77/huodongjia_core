<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Tailwind 测试</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-50">
  <h1 class="text-2xl font-bold mb-4">Tailwind CSS 测试</h1>
  
  <div class="space-y-4">
    <button class="h-11 px-6 rounded-[22px] bg-gradient-to-br from-blue-400 to-blue-500 text-white">
      渐变按钮测试
    </button>
    
    <button class="h-11 px-6 rounded-[22px] bg-blue-500 text-white shadow-[0_2px_8px_rgba(59,130,246,0.3)]">
      自定义阴影测试
    </button>
    
    <button class="h-11 px-6 rounded-[22px] bg-blue-500 text-white" style="box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);">
      内联样式阴影测试
    </button>
  </div>
</body>
</html>
