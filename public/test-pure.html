<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纯 CSS 测试 - 不使用 Tailwind</title>
  <style>
    body {
      padding: 2rem;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 {
      font-size: 1.875rem;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 2rem;
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #334155;
      margin-top: 2rem;
      margin-bottom: 1rem;
    }
    .flex {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .box {
      width: 100px;
      height: 100px;
      border-radius: 0.75rem;
    }
    .bg-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
    .bg-secondary { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); }
    .bg-accent { background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%); }
    
    button {
      padding: 0.75rem 1.5rem;
      color: white;
      border: none;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 150ms;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }
    .btn-primary:hover {
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3);
    }
    .btn-secondary:hover {
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
      transform: translateY(-1px);
    }
    .note {
      margin-top: 2rem;
      padding: 1rem;
      background: #fef3c7;
      border: 1px solid #fde047;
      border-radius: 0.5rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <h1>✅ 纯 CSS 测试 (不依赖 Tailwind)</h1>
  
  <h2>渐变色块</h2>
  <div class="flex">
    <div class="box bg-primary"></div>
    <div class="box bg-secondary"></div>
    <div class="box bg-accent"></div>
  </div>

  <h2>按钮测试</h2>
  <div class="flex">
    <button class="btn-primary">Primary Button</button>
    <button class="btn-secondary">Secondary Button</button>
  </div>

  <div class="note">
    <strong>✅ 如果看到蓝色、橙色、紫色的渐变</strong> → 浏览器 CSS 渲染正常<br>
    <strong>📝 说明</strong>：这个页面完全不依赖 Tailwind，用来确认浏览器本身工作正常
  </div>
</body>
</html>
