<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>简单测试</title>
  <style>
    /* 直接写 CSS 验证浏览器是否支持 */
    .test-button {
      height: 44px;
      padding: 0 24px;
      border-radius: 22px;
      background-color: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body style="padding: 32px; background-color: #f8fafc;">
  <h1>直接 CSS 测试</h1>
  <button class="test-button">这是蓝色按钮吗？</button>
  
  <h1 style="margin-top: 32px;">背景色测试</h1>
  <div style="background-color: #3b82f6; color: white; padding: 16px;">
    这个背景是蓝色吗？
  </div>
</body>
</html>
